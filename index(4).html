                            试试调整筛选条件，或添加新的网站
                        </div>
                        <button onclick="app.clearFilters()">清除所有筛选</button>
                        <button onclick="app.openAdd()" style="margin-left:8px;">＋ 添加网站</button>
                    </div>
                `;
            }

            /** 更新筛选器下拉选项 */
            _populateFilters() {
                const all = this.repo.getAll();
                const countries = [...new Set(all.map(s => s.country))].sort((a, b) => a.localeCompare(b));
                const cats = [...new Set(all.map(s => s.category))];

                const countryEl = this.els.country;
                const catEl = this.els.category;
                const currentCountry = countryEl.value;
                const currentCat = catEl.value;

                if (countryEl.options.length <= 1) {
                    countryEl.innerHTML = '<option value="">全部地区</option>' +
                        countries.map(c => `<option value="${Utils.esc(c)}">${Utils.esc(c)}</option>`).join('');
                }
                if (catEl.options.length <= 1) {
                    catEl.innerHTML = '<option value="">全部分类</option>' +
                        cats.map(c => `<option value="${Utils.esc(c)}">${Utils.esc(c)}</option>`).join('');
                }
                // 恢复选中值
                if (currentCountry) countryEl.value = currentCountry;
                if (currentCat) catEl.value = currentCat;
            }

            /** 更新批量操作栏 */
            _updateBulkBar() {
                const count = this.state.selected.size;
                const bar = this.els.bulkBar;
                const info = this.els.bulkInfo;
                if (count > 0) {
                    bar.classList.add('show');
                    info.textContent = `已选 ${count} 个`;
                } else {
                    bar.classList.remove('show');
                }
            }

            /** 渲染最近访问 */
            _renderRecent() {
                const recents = this.repo.getRecent();
                const container = this.els.recentContainer;
                const bar = this.els.recentBar;
                if (recents.length === 0) {
                    container.classList.add('hidden');
                    return;
                }
                container.classList.remove('hidden');
                const sites = recents.map(id => this.repo.getById(id)).filter(Boolean);
                bar.innerHTML = sites.map(s => {
                    const icon = `https://www.google.com/s2/favicons?domain=${Utils.getDomain(s.url)}&sz=16`;
                    return `
                        <a class="recent-chip" href="javascript:void(0)" onclick="app.recordVisit('${s.id}');window.open('${Utils.esc(s.url)}','_blank');">
                            <img src="${icon}" alt="" loading="lazy" onerror="this.style.display='none'">
                            ${Utils.esc(s.name)}
                        </a>
                    `;
                }).join('');
            }

            /** =============================================================
             *  操作函数 (暴露给 HTML)
             *  ============================================================= */

            /** 切换收藏 */
            toggleFav(id) {
                this.repo.toggleFavorite(id);
                this.render();
            }

            /** 检查更新 (单个) */
            async checkUpdate(id) {
                const s = this.repo.getById(id);
                if (!s) return;
                this.repo.setUpdate(id, { status: '检查中…', date: new Date().toLocaleString() });
                this.render();
                try {
                    const r = await fetch(s.url, { method: 'HEAD', mode: 'cors', signal: AbortSignal.timeout(8000) });
                    this.repo.setUpdate(id, {
                        status: r.ok ? '✅ 可访问' : '⚠️ 返回异常',
                        date: new Date().toLocaleString()
                    });
                } catch (e) {
                    this.repo.setUpdate(id, {
                        status: '🔒 跨域限制 (需打开查看)',
                        date: new Date().toLocaleString()
                    });
                }
                this.render();
            }

            /** 批量检查更新 */
            async batchCheck() {
                if (this.state.checking) return;
                const all = this.repo.getAll();
                const targets = all.slice(0, 60);
                this.state.checking = true;
                this.els.batchCheckBtn.disabled = true;
                this.els.batchCheckBtn.innerHTML = '⏳ 检查中…';

                const container = this.els.progressContainer;
                const fill = this.els.progressFill;
                const label = this.els.progressLabel;
                const status = this.els.progressStatus;
                container.classList.remove('hidden');

                let completed = 0;
                let success = 0,
                    fail = 0,
                    skip = 0;
                const total = targets.length;

                const updateOne = async (s) => {
                    try {
                        const r = await fetch(s.url, { method: 'HEAD', mode: 'cors', signal: AbortSignal.timeout(6000) });
                        this.repo.setUpdate(s.id, {
                            status: r.ok ? '✅ 可访问' : '⚠️ 异常',
                            date: new Date().toLocaleString()
                        });
                        success++;
                    } catch {
                        this.repo.setUpdate(s.id, {
                            status: '🔒 跨域限制',
                            date: new Date().toLocaleString()
                        });
                        fail++;
                    }
                    completed++;
                    const pct = Math.round((completed / total) * 100);
                    fill.style.width = pct + '%';
                    label.textContent = `${completed} / ${total}`;
                    status.textContent = `✅${success} ⚠️${fail}`;
                    // 每10个渲染一次
                    if (completed % 3 === 0) this.render();
                };

                // 并发控制 (5个)
                const concurrency = 5;
                const queue = [...targets];
                const workers = [];
                for (let i = 0; i < concurrency; i++) {
                    workers.push((async () => {
                        while (queue.length) {
                            const s = queue.shift();
                            await updateOne(s);
                        }
                    })());
                }
                await Promise.all(workers);

                container.classList.add('hidden');
                this.state.checking = false;
                this.els.batchCheckBtn.disabled = false;
                this.els.batchCheckBtn.innerHTML = '🔄 批量检查';
                this.render();
                Utils.toast(`批量检查完成: ✅ ${success} 可访问, ⚠️ ${fail} 需手动查看`, 'success');
            }

            /** 添加网站 (打开模态框) */
            openAdd() {
                this.els.dlgTitle.textContent = '添加网站';
                this.els.f_editId.value = '';
                ['f_name', 'f_country', 'f_url', 'f_focus', 'f_tags', 'f_desc'].forEach(id => document.getElementById(id).value = '');
                this.els.f_priority.value = 'S';
                this.els.f_category.value = '产品测评/实测';
                this.els.dlg.showModal();
                setTimeout(() => this.els.f_name.focus(), 50);
            }

            /** 编辑网站 */
            editSite(id) {
                const s = this.repo.getById(id);
                if (!s) { Utils.toast('未找到该网站', 'error'); return; }
                this.els.dlgTitle.textContent = '编辑网站';
                this.els.f_editId.value = id;
                this.els.f_name.value = s.name;
                this.els.f_country.value = s.country;
                this.els.f_priority.value = s.priority;
                this.els.f_category.value = s.category;
                this.els.f_url.value = s.url;
                this.els.f_focus.value = s.focus || '';
                this.els.f_tags.value = (s.tags || []).join(',');
                this.els.f_desc.value = s.desc || '';
                this.els.dlg.showModal();
                setTimeout(() => this.els.f_name.focus(), 50);
            }

            /** 保存网站 (添加或编辑) */
            saveSite() {
                const name = this.els.f_name.value.trim();
                const url = this.els.f_url.value.trim();
                const editId = this.els.f_editId.value;

                if (!name || !url) {
                    Utils.toast('请填写网站名称和网址', 'error');
                    return;
                }
                // P0：URL 必须显式包含 http:// 或 https://，不再自动补协议
                if (!Utils.isValidUrl(url)) {
                    Utils.toast('URL 格式无效：必须以 http:// 或 https:// 开头', 'error');
                    this.els.f_url.focus();
                    return;
                }

                // 标签允许手动维护；留空时才自动推断
                const rawTags = this.els.f_tags.value.trim();
                const tags = rawTags
                    ? [...new Set(rawTags.split(/[,，、]/).map(t => t.trim()).filter(Boolean))]
                    : Utils.inferTags(name, this.els.f_focus.value.trim(), this.els.f_category.value);

                const invalidTags = tags.filter(t => !PRODUCT_TAGS.includes(t));
                if (invalidTags.length) {
                    Utils.toast(`产品标签无效：${invalidTags.join('、')}。请使用预设标签`, 'error');
                    this.els.f_tags.focus();
                    return;
                }

                const data = {
                    name,
                    country: this.els.f_country.value.trim() || '其他',
                    priority: this.els.f_priority.value,
                    category: this.els.f_category.value,
                    url,
                    focus: this.els.f_focus.value.trim() || '待补充',
                    desc: this.els.f_desc.value.trim() || '自定义网站',
                    tags
                };

                try {
                    if (editId) {
                        // 仅允许更新自定义站点；Repository 内部会排除自身做重复检查
                        const current = this.repo.getById(editId);
                        if (!current) { Utils.toast('未找到该网站', 'error'); return; }
                        this.repo.update(editId, data);
                        Utils.toast('✅ 网站已更新', 'success');
                    } else {
                        this.repo.add(data);
                        Utils.toast('✅ 网站已添加', 'success');
                    }
                    this.closeModal();
                    this.render();
                } catch (e) {
                    Utils.toast(e.message || '保存失败', 'error');
                }
            }

            /** 删除网站 (确认) */
            deleteSite(id) {
                const s = this.repo.getById(id);
                if (!s) return;
                if (confirm(`确定要删除 "${s.name}" 吗？`)) {
                    this.repo.remove(id);
                    this.state.selected.delete(id);
                    this.render();
                    Utils.toast(`已删除 "${s.name}"`, 'success');
                }
            }

            /** 关闭模态框 */
            closeModal() {
                this.els.dlg.close();
            }

            /** 清除筛选 */
            clearFilters() {
                this.els.search.value = '';
                this.els.priority.value = '';
                this.els.country.value = '';
                this.els.category.value = '';
                this.els.productTag.value = '';
                this.els.favoriteFilter.value = '';
                this._updateFilters();
                Utils.toast('已清除所有筛选', 'info');
            }

            /** 记录访问 (最近访问) */
            recordVisit(id) {
                this.repo.addRecent(id);
                this._renderRecent();
            }

            /** 清除最近访问 */
            clearRecent() {
                this.repo.clearRecent();
                this._renderRecent();
            }

            /** 导出数据 */
            exportData() {
                const data = this.repo.exportCustom();
                if (data.length === 0) { Utils.toast('没有自定义数据可导出', 'warning'); return; }
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = '我的新能源网站池.json';
                a.click();
                URL.revokeObjectURL(a.href);
                Utils.toast(`导出 ${data.length} 条自定义数据`, 'success');
            }

            /** 导入数据 */
            importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const raw = JSON.parse(reader.result);
                        if (!Array.isArray(raw)) throw new Error('数据格式错误');
                        // 简单校验
                        const valid = raw.filter(item => item.name && item.url);
                        if (valid.length === 0) { Utils.toast('未找到有效的网站数据', 'error'); return; }
                        // 智能合并 (使用skip策略)
                        const result = this.repo.importSites(valid, 'skip');
                        let msg = `导入完成: 新增 ${result.added} 条`;
                        if (result.skipped > 0) msg += `，跳过 ${result.skipped} 条 (重复)`;
                        if (result.conflicts.length > 0) msg += `，${result.conflicts.length} 个名称冲突已跳过`;
                        Utils.toast(msg, 'success');
                        this.render();
                    } catch (err) {
                        Utils.toast('导入失败: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
                this.els.importFile.value = '';
            }

            /** 批量收藏 */
            bulkFavorite() {
                const ids = [...this.state.selected];
                if (ids.length === 0) return;
                this.repo.bulkFavorite(ids);
                Utils.toast(`已收藏 ${ids.length} 个网站`, 'success');
                this.clearBulk();
                this.render();
            }

            /** 批量取消收藏 */
            bulkUnfavorite() {
                const ids = [...this.state.selected];
                if (ids.length === 0) return;
                this.repo.bulkUnfavorite(ids);
                Utils.toast(`已取消收藏 ${ids.length} 个网站`, 'success');
                this.clearBulk();
                this.render();
            }

            /** 批量导出选中 */
            bulkExport() {
                const ids = [...this.state.selected];
                if (ids.length === 0) return;
                const sites = ids.map(id => this.repo.getById(id)).filter(Boolean);
                if (sites.length === 0) { Utils.toast('未找到选中的网站', 'error'); return; }
                const data = sites.map(s => ({ ...s, id: undefined }));
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = '选中的网站.json';
                a.click();
                URL.revokeObjectURL(a.href);
                Utils.toast(`导出 ${data.length} 个网站`, 'success');
                this.clearBulk();
            }

            /** 批量删除选中的网站 */
            bulkDelete() {
                const ids = [...this.state.selected];
                const validIds = ids.filter(id => this.repo.getById(id));
                if (validIds.length === 0) { Utils.toast('没有选中可删除的网站', 'warning'); return; }
                if (!confirm(`确定要删除选中的 ${validIds.length} 个网站吗？基础网站删除后可通过重新导入/恢复数据找回。`)) return;
                const count = this.repo.bulkRemove(validIds);
                Utils.toast(`已删除 ${count} 个网站`, 'success');
                this.clearBulk();
                this.render();
            }

            /** 清除批量选择 */
            clearBulk() {
                this.state.selected.clear();
                this.state.bulkMode = false;
                this._updateBulkBar();
                this.render();
            }

            /** 应用主题 */
            _applyTheme() {
                const saved = localStorage.getItem('theme');
                const root = document.documentElement;
                if (saved === 'dark') {
                    root.classList.add('dark');
                    root.classList.remove('light');
                } else if (saved === 'light') {
                    root.classList.add('light');
                    root.classList.remove('dark');
                } else {
                    // 跟随系统，不添加额外类
                    root.classList.remove('dark', 'light');
                }
            }
        }

        /** =============================================================
         *  初始化
         *  ============================================================= */
        let app;
        document.addEventListener('DOMContentLoaded', () => {
            Toast.init();
            app = new App();
            // 暴露全局 (用于 onclick)
            window.app = app;
            // 第一次渲染后，初始化筛选器选项
            app._populateFilters();
        });

        /** 修复 Safari 等浏览器的 dialog 兼容 */
        if (typeof HTMLDialogElement === 'undefined') {
            console.warn('Dialog not supported, fallback to polyfill? 请使用现代浏览器。');
        }
    </script>
</body>
</html>
