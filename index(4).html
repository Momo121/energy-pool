<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新能源海外信息网站池</title>
    <style>
        /* ============================================================
               CSS Variables · Light & Dark 色板
               ============================================================ */
        :root {
            --bg: #f5f7fb;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-hover: #f0f4ff;
            --text: #172033;
            --text-secondary: #344054;
            --muted: #667085;
            --line: #e4e7ec;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --accent-border: #bfdbfe;
            --shadow: rgba(0, 0, 0, 0.06);
            --shadow-lg: rgba(0, 0, 0, 0.15);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --s-bg: #dc2626;
            --a-bg: #d97706;
            --b-bg: #667085;
            --tag-colors: {
                "户储": #2563eb,
                    "混逆": #7c3aed,
                    "电池": #0891b2,
                    "EMS": #059669,
                    "BESS": #7c3aed,
                    "光伏": #ea580c,
                    "充电": #dc2626
            }
            --tag-bg: #f2f4f7;
            --tag-text: #475467;
            --toast-bg: #1e293b;
            --toast-text: #f1f5f9;
            --modal-overlay: rgba(0, 0, 0, 0.45);
            --header-bg: #101828;
            --header-text: #ffffff;
            --header-sub: #cbd5e1;
        }

        @media (prefers-color-scheme: dark) {
            :root:not(.light) {
                --bg: #0f1724;
                --bg-card: #1a2332;
                --bg-input: #1a2332;
                --bg-hover: #263247;
                --text: #e8edf5;
                --text-secondary: #b0c0d4;
                --muted: #8899b0;
                --line: #2d3a4f;
                --accent: #3b82f6;
                --accent-hover: #60a5fa;
                --accent-light: #1e293b;
                --accent-border: #334155;
                --shadow: rgba(0, 0, 0, 0.4);
                --shadow-lg: rgba(0, 0, 0, 0.6);
                --tag-bg: #2d3a4f;
                --tag-text: #b0c0d4;
                --toast-bg: #2d3a4f;
                --toast-text: #e8edf5;
                --modal-overlay: rgba(0, 0, 0, 0.7);
                --header-bg: #0a0f18;
                --header-text: #e8edf5;
                --header-sub: #8899b0;
            }
        }

        /* 手动暗黑模式覆盖 */
        :root.dark {
            --bg: #0f1724;
            --bg-card: #1a2332;
            --bg-input: #1a2332;
            --bg-hover: #263247;
            --text: #e8edf5;
            --text-secondary: #b0c0d4;
            --muted: #8899b0;
            --line: #2d3a4f;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: #1e293b;
            --accent-border: #334155;
            --shadow: rgba(0, 0, 0, 0.4);
            --shadow-lg: rgba(0, 0, 0, 0.6);
            --tag-bg: #2d3a4f;
            --tag-text: #b0c0d4;
            --toast-bg: #2d3a4f;
            --toast-text: #e8edf5;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --header-bg: #0a0f18;
            --header-text: #e8edf5;
            --header-sub: #8899b0;
        }
        :root.light {
            --bg: #f5f7fb;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --bg-hover: #f0f4ff;
            --text: #172033;
            --text-secondary: #344054;
            --muted: #667085;
            --line: #e4e7ec;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --accent-border: #bfdbfe;
            --shadow: rgba(0, 0, 0, 0.06);
            --shadow-lg: rgba(0, 0, 0, 0.15);
            --tag-bg: #f2f4f7;
            --tag-text: #475467;
            --toast-bg: #1e293b;
            --toast-text: #f1f5f9;
            --modal-overlay: rgba(0, 0, 0, 0.45);
            --header-bg: #101828;
            --header-text: #ffffff;
            --header-sub: #cbd5e1;
        }

        /* ============================================================
               Reset & Base
               ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Inter, "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            line-height: 1.5;
        }
        button {
            cursor: pointer;
            font: inherit;
            border: none;
            background: none;
            color: inherit;
        }
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
            background: var(--bg-input);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 14px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        a {
            color: var(--accent);
            text-decoration: none;
        }
        a:hover {
            color: var(--accent-hover);
        }

        /* ============================================================
               Scrollbar
               ============================================================ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        /* ============================================================
               Header
               ============================================================ */
        header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            transition: background var(--transition);
        }
        header h1 {
            margin: 0 0 4px 0;
            font-size: 24px;
            letter-spacing: -0.3px;
        }
        .header-sub {
            color: var(--header-sub);
            font-size: 13px;
            margin-bottom: 12px;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar input,
        .toolbar select,
        .toolbar button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--header-text);
            border-radius: var(--radius-sm);
            padding: 7px 12px;
            font-size: 13px;
            min-height: 36px;
        }
        .toolbar input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .toolbar input,
        .toolbar select {
            background: rgba(255, 255, 255, 0.06);
        }
        .toolbar input:focus,
        .toolbar select:focus {
            background: rgba(255, 255, 255, 0.10);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }
        .toolbar select option {
            color: var(--text);
            background: var(--bg-card);
        }
        .toolbar .primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .toolbar .primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .toolbar .secondary {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }
        .toolbar .secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* ============================================================
               Main Layout
               ============================================================ */
        main {
            max-width: 1500px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* ============================================================
               Stats
               ============================================================ */
        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .stat {
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background var(--transition), border-color var(--transition);
        }
        .stat b {
            font-size: 20px;
            margin-right: 4px;
        }

        /* ============================================================
               Notice / 最近访问
               ============================================================ */
        .notice {
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 16px;
            transition: background var(--transition), border-color var(--transition);
        }
        .recent-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0 12px 0;
            margin-bottom: 8px;
            scrollbar-width: thin;
        }
        .recent-bar::-webkit-scrollbar {
            height: 4px;
        }
        .recent-bar::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 2px;
        }
        .recent-chip {
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 12px;
            white-space: nowrap;
            color: var(--text-secondary);
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .recent-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .recent-chip img {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ============================================================
               Category & Grid
               ============================================================ */
        .category {
            margin: 28px 0;
        }
        .cat-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--line);
            padding-bottom: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
            transition: border-color var(--transition);
        }
        .cat-head h2 {
            margin: 0;
            font-size: 19px;
            font-weight: 600;
        }
        .cat-head .cat-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--muted);
        }
        .cat-head .cat-meta select {
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 6px;
            background: var(--bg-input);
            border: 1px solid var(--line);
            color: var(--text);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 12px;
        }

        /* ============================================================
               Card
               ============================================================ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
            min-height: 200px;
            position: relative;
        }
        .card:hover {
            border-color: var(--accent-border);
            box-shadow: 0 4px 16px var(--shadow);
        }
        .card-top {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }
        .card-top .fav-btn {
            font-size: 18px;
            line-height: 1;
            padding: 0;
            background: none;
            border: none;
            color: var(--muted);
            transition: color var(--transition);
            flex-shrink: 0;
            margin-top: 1px;
        }
        .card-top .fav-btn.on {
            color: #f59e0b;
        }
        .card-top .fav-btn:hover {
            transform: scale(1.15);
        }
        .card-top .site-icon {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            flex-shrink: 0;
            background: var(--tag-bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-top .site-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .card-top .site-icon .fallback {
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }
        .card-name {
            font-weight: 700;
            font-size: 15px;
            flex: 1;
            line-height: 1.3;
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            border-radius: 999px;
            padding: 2px 10px;
            color: #fff;
            white-space: nowrap;
            flex-shrink: 0;
            height: 22px;
            display: inline-flex;
            align-items: center;
        }
        .badge.S {
            background: var(--s-bg);
        }
        .badge.A {
            background: var(--a-bg);
        }
        .badge.B {
            background: var(--b-bg);
        }

        .card-meta {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
        }
        .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            flex: 1;
        }
        .card-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .card-tags .tag {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
            background: var(--tag-bg);
            color: var(--tag-text);
            transition: background var(--transition), color var(--transition);
        }
        /* 标签色彩化 */
        .card-tags .tag-tag-户储 {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .card-tags .tag-tag-混逆 {
            background: #ede9fe;
            color: #6d28d9;
        }
        .card-tags .tag-tag-电池 {
            background: #cffafe;
            color: #0e7490;
        }
        .card-tags .tag-tag-EMS {
            background: #d1fae5;
            color: #047857;
        }
        .card-tags .tag-tag-BESS {
            background: #ede9fe;
            color: #6d28d9;
        }
        .card-tags .tag-tag-光伏 {
            background: #ffedd5;
            color: #c2410c;
        }
        .card-tags .tag-tag-充电 {
            background: #fee2e2;
            color: #b91c1c;
        }
        @media (prefers-color-scheme: dark) {
            .card-tags .tag-tag-户储 {
                background: #1e293b;
                color: #60a5fa;
            }
            .card-tags .tag-tag-混逆 {
                background: #2e1a47;
                color: #a78bfa;
            }
            .card-tags .tag-tag-电池 {
                background: #164e63;
                color: #22d3ee;
            }
            .card-tags .tag-tag-EMS {
                background: #064e3b;
                color: #34d399;
            }
            .card-tags .tag-tag-BESS {
                background: #2e1a47;
                color: #a78bfa;
            }
            .card-tags .tag-tag-光伏 {
                background: #431407;
                color: #fb923c;
            }
            .card-tags .tag-tag-充电 {
                background: #450a0a;
                color: #f87171;
            }
        }
        :root.dark .card-tags .tag-tag-户储 {
            background: #1e293b;
            color: #60a5fa;
        }
        :root.dark .card-tags .tag-tag-混逆 {
            background: #2e1a47;
            color: #a78bfa;
        }
        :root.dark .card-tags .tag-tag-电池 {
            background: #164e63;
            color: #22d3ee;
        }
        :root.dark .card-tags .tag-tag-EMS {
            background: #064e3b;
            color: #34d399;
        }
        :root.dark .card-tags .tag-tag-BESS {
            background: #2e1a47;
            color: #a78bfa;
        }
        :root.dark .card-tags .tag-tag-光伏 {
            background: #431407;
            color: #fb923c;
        }
        :root.dark .card-tags .tag-tag-充电 {
            background: #450a0a;
            color: #f87171;
        }

        .card-updated {
            font-size: 12px;
            color: var(--muted);
        }
        .card-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .card-actions a,
        .card-actions button {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 6px;
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid var(--accent-border);
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .card-actions a:hover,
        .card-actions button:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .card-actions .danger {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fecaca;
        }
        .card-actions .danger:hover {
            background: #b91c1c;
            color: #fff;
            border-color: #b91c1c;
        }
        .card-checkbox {
            flex-shrink: 0;
            margin-top: 2px;
        }
        .card-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* ============================================================
               Empty state
               ============================================================ */
        .empty {
            padding: 60px 20px;
            text-align: center;
            color: var(--muted);
            background: var(--bg-card);
            border: 1px dashed var(--line);
            border-radius: var(--radius);
            transition: background var(--transition), border-color var(--transition);
        }
        .empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }
        .empty button {
            margin-top: 12px;
            padding: 8px 20px;
            background: var(--accent);
            color: #fff;
            border-radius: var(--radius-sm);
            font-weight: 600;
            border: none;
        }
        .empty button:hover {
            background: var(--accent-hover);
        }

        /* ============================================================
               Modal
               ============================================================ */
        dialog {
            border: 0;
            border-radius: var(--radius);
            padding: 0;
            width: min(600px, 94vw);
            max-height: 90vh;
            box-shadow: 0 24px 80px var(--shadow-lg);
            background: var(--bg-card);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            overflow-y: auto;
        }
        dialog::backdrop {
            background: var(--modal-overlay);
            backdrop-filter: blur(2px);
        }
        .modal {
            padding: 24px 28px;
        }
        .modal h2 {
            margin-top: 0;
            font-size: 20px;
        }
        .modal .form {
            display: grid;
            gap: 12px;
        }
        .modal .form label {
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .modal .form .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 18px;
        }
        .modal-actions button {
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            border: 1px solid var(--line);
            background: var(--bg-input);
            color: var(--text);
            transition: all var(--transition);
        }
        .modal-actions .primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .modal-actions .primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* ============================================================
               Toast
               ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            background: var(--toast-bg);
            color: var(--toast-text);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            box-shadow: 0 8px 32px var(--shadow-lg);
            font-size: 14px;
            animation: slideUp 0.25s ease;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-left: 4px solid var(--accent);
        }
        .toast.success {
            border-left-color: #22c55e;
        }
        .toast.error {
            border-left-color: #ef4444;
        }
        .toast.warning {
            border-left-color: #f59e0b;
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
        }
        .toast .toast-close:hover {
            color: var(--text);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
               Progress / 批量检查
               ============================================================ */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        .progress-track {
            flex: 1;
            height: 6px;
            background: var(--line);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .progress-label {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }

        /* ============================================================
               Bulk bar (浮动批量操作条)
               ============================================================ */
        .bulk-bar {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px 20px;
            box-shadow: 0 8px 40px var(--shadow-lg);
            display: none;
            align-items: center;
            gap: 16px;
            z-index: 50;
            flex-wrap: wrap;
            justify-content: center;
            transition: background var(--transition), border-color var(--transition);
        }
        .bulk-bar.show {
            display: flex;
        }
        .bulk-bar .bulk-info {
            font-size: 14px;
            font-weight: 500;
        }
        .bulk-bar button {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--line);
            background: var(--bg-input);
            color: var(--text);
            transition: all var(--transition);
        }
        .bulk-bar .primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .bulk-bar .primary:hover {
            background: var(--accent-hover);
        }
        .bulk-bar .danger {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fecaca;
        }
        .bulk-bar .danger:hover {
            background: #b91c1c;
            color: #fff;
            border-color: #b91c1c;
        }

        /* ============================================================
               Responsive
               ============================================================ */
        @media (max-width: 700px) {
            header {
                padding: 16px;
            }
            header h1 {
                font-size: 20px;
            }
            .toolbar {
                gap: 6px;
            }
            .toolbar input,
            .toolbar select,
            .toolbar button {
                font-size: 12px;
                padding: 5px 10px;
                min-height: 32px;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .modal .form .row {
                grid-template-columns: 1fr;
            }
            .stats .stat {
                font-size: 12px;
                padding: 6px 12px;
            }
            .stats .stat b {
                font-size: 17px;
            }
            main {
                padding: 0 12px;
            }
            .bulk-bar {
                bottom: 12px;
                padding: 8px 14px;
                width: 94%;
                gap: 10px;
            }
            .bulk-bar .bulk-info {
                font-size: 12px;
            }
            .bulk-bar button {
                font-size: 12px;
                padding: 4px 12px;
            }
            .cat-head h2 {
                font-size: 17px;
            }
        }

        /* ============================================================
               Utilities
               ============================================================ */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .gap-8 {
            gap: 8px;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .text-muted {
            color: var(--muted);
        }
        .text-sm {
            font-size: 13px;
        }
        .fw-600 {
            font-weight: 600;
        }

        /* 加载旋转动画 */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 列表视图切换 */
        .view-toggle {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .view-toggle button {
            padding: 4px 12px;
            font-size: 13px;
            background: var(--bg-input);
            border: none;
            border-right: 1px solid var(--line);
            color: var(--muted);
            transition: all var(--transition);
        }
        .view-toggle button:last-child {
            border-right: none;
        }
        .view-toggle button.active {
            background: var(--accent);
            color: #fff;
        }
        .view-toggle button:hover:not(.active) {
            background: var(--bg-hover);
        }

        /* list 视图 */
        .grid.list-view {
            grid-template-columns: 1fr;
        }
        .grid.list-view .card {
            flex-direction: row;
            flex-wrap: wrap;
            min-height: auto;
            padding: 12px 16px;
            align-items: center;
        }
        .grid.list-view .card>* {
            flex: 1 1 auto;
        }
        .grid.list-view .card .card-top {
            flex: 0 0 auto;
            min-width: 200px;
        }
        .grid.list-view .card .card-desc {
            flex: 2;
            min-width: 150px;
        }
        .grid.list-view .card .card-actions {
            flex: 0 0 auto;
        }
        @media (max-width: 700px) {
            .grid.list-view .card {
                flex-direction: column;
                align-items: stretch;
            }
            .grid.list-view .card .card-top {
                min-width: auto;
            }
            .grid.list-view .card .card-desc {
                flex: auto;
                min-width: auto;
            }
        }

        /* 快捷提示 (键盘快捷键) */
        .kbd-hint {
            font-size: 11px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: inline-block;
            font-family: monospace;
        }
    </style>
</head>

    <!-- ============================================================
    HEADER
    ============================================================ -->
    <header>
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;">

            <select id="category"><option value="">全部分类</option></select>
            <select id="productTag"><option value="">全部产品标签</option><option>户储</option><option>混逆</option><option>电池</option><option>EMS</option><option>BESS</option><option>光伏</option><option>充电</option></select>

                <button data-view="list" title="列表视图">☰</button>
            </div>
            <button class="primary" onclick="app.openAdd()">＋ 添加</button>

        /** =============================================================
         *  工具函数
         *  ============================================================= */
        const Utils = {
            /** 生成短id */
            uid() { return 'c' + Date.now() + '_' + Math.random().toString(36).slice(2, 6); },

            /** 安全转义HTML */
            esc(s) {
                if (!s) return '';
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return String(s).replace(/[&<>"']/g, m => map[m]);
            },

            /** 推断标签 */
            inferTags(name, focus, category) {
                const s = (name + ' ' + focus + ' ' + category).toLowerCase();
                const map = [
                    ['户储', /户储|家庭电池|home battery|residential|家庭储能|household/],
                    ['混逆', /混合逆变|hybrid inverter|hybrid|混逆/],
                    ['电池', /电池|battery|batteries/],
                    ['EMS', /ems|hems|能源管理|energy management|home assistant/],
                    ['BESS', /bess|储能系统|energy storage|battery energy storage/],
                    ['光伏', /光伏|solar|pv|photovoltaic/],
                    ['充电', /充电|ev|电动车|charger|charging/]
                ];
                return map.filter(x => x[1].test(s)).map(x => x[0]);
            },

            /** 校验URL */
            isValidUrl(str) {
                try {
                    const u = new URL(str);
                    return u.protocol === 'http:' || u.protocol === 'https:';
                } catch { return false; }
            },

            /** 防抖 */
            debounce(fn, delay = 300) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay);
                };
            },

            /** 获取域名 (用于favicon) */
            getDomain(url) {
                try {
                    const u = new URL(url);
                    return u.hostname;
                } catch { return ''; }
            },

            /** 格式化时间 */
            formatTime(ts) {
                if (!ts) return '';
                const d = new Date(ts);
                return d.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }
        };

        /** =============================================================
         *  SiteRepository 类 (数据层)
         *  ============================================================= */
        class SiteRepository {
            /**
             * 数据层说明：
             * 1. BASE_SITES 永远不直接修改。
             * 2. 用户对基础网站的“编辑”保存为 _baseId 覆盖记录。
             * 3. 用户对基础网站的“删除”保存为 _deleted 墓碑记录。
             * 4. 真正的自定义网站仍直接存放在 energySites_custom。
             * 这样既能让所有网站支持编辑/删除，又不会破坏硬编码基础数据。
             */
            constructor(storageKey, baseSites) {
                this.storageKey = storageKey;
                this.baseSites = baseSites;
                this._cache = null;
                this._custom = null;
                this._favorites = null;
                this._updates = null;
                this._recent = null;
                this._load();
            }

            _load() {
                try {
                    this._custom = JSON.parse(localStorage.getItem(this.storageKey + '_custom') || '[]');
                    this._favorites = JSON.parse(localStorage.getItem(this.storageKey + '_favorites') || '[]');
                    this._updates = JSON.parse(localStorage.getItem(this.storageKey + '_updates') || '{}');
                    this._recent = JSON.parse(localStorage.getItem(this.storageKey + '_recent') || '[]');
                    if (!Array.isArray(this._custom)) this._custom = [];
                    if (!Array.isArray(this._favorites)) this._favorites = [];
                    if (!this._updates || typeof this._updates !== 'object') this._updates = {};
                    if (!Array.isArray(this._recent)) this._recent = [];
                } catch {
                    this._custom = [];
                    this._favorites = [];
                    this._updates = {};
                    this._recent = [];
                }
                this._buildCache();
            }

            _buildCache() {
                const meta = this._custom.filter(s => s && s._baseId);
                const base = this.baseSites.map((x, i) => {
                    const id = 'b' + i;
                    const override = meta.find(s => s._baseId === id);
                    if (override && override._deleted) return null;
                    const item = {
                        id,
                        name: x[0], country: x[1], priority: x[2], category: x[3],
                        url: x[4], focus: x[5], desc: x[6], custom: false,
                        tags: Utils.inferTags(x[0], x[5], x[3]), createdAt: null
                    };
                    if (override) {
                        Object.assign(item, override);
                        item.id = id;
                        item.custom = false;
                        item._baseId = id;
                        item.tags = override.tags || Utils.inferTags(item.name, item.focus, item.category);
                    }
                    return item;
                }).filter(Boolean);

                const custom = this._custom
                    .filter(s => s && !s._baseId && !s._deleted)
                    .map(s => ({
                        ...s,
                        custom: true,
                        tags: s.tags || Utils.inferTags(s.name, s.focus, s.category)
                    }));
                this._cache = [...base, ...custom];
            }

            _persist() {
                try {
                    localStorage.setItem(this.storageKey + '_custom', JSON.stringify(this._custom));
                    localStorage.setItem(this.storageKey + '_favorites', JSON.stringify(this._favorites));
                    localStorage.setItem(this.storageKey + '_updates', JSON.stringify(this._updates));
                    localStorage.setItem(this.storageKey + '_recent', JSON.stringify(this._recent));
                } catch (e) {
                    if (e.name === 'QuotaExceededError') Utils.toast('存储空间不足，请清理部分数据', 'error');
                    else console.warn('Persist error:', e);
                }
                this._buildCache();
            }

            getAll() { return this._cache; }
            getById(id) { return this._cache.find(s => s.id === id); }

            /** 判断是否为基础网站（包括已经被编辑过的基础网站） */
            isBase(id) { return /^b\d+$/.test(String(id)); }

            /** 添加自定义站点 */
            add(site) {
                const exists = this._custom.some(s => !s._baseId && !s._deleted && s.name === site.name && s.url === site.url);
                if (exists) throw new Error('该网站已存在 (名称+URL重复)');
                const newSite = {
                    ...site, id: Utils.uid(), custom: true,
                    tags: site.tags || Utils.inferTags(site.name, site.focus, site.category),
                    createdAt: Date.now()
                };
                this._custom.push(newSite);
                this._persist();
                return newSite;
            }

            /**
             * 更新任意网站：
             * - 自定义网站：直接更新 custom 记录
             * - 基础网站：写入覆盖记录，不修改 BASE_SITES
             */
            update(id, data) {
                const current = this.getById(id);
                if (!current) throw new Error('未找到该网站');

                // 与所有当前可见网站做名称+URL重复检查，排除自身。
                const dup = this._cache.some(s => s.id !== id && s.name === data.name && s.url === data.url);
                if (dup) throw new Error('名称+URL 与其他网站重复');

                if (this.isBase(id)) {
                    const idx = this._custom.findIndex(s => s._baseId === id);
                    const record = {
                        ...current, ...data,
                        id, _baseId: id, _deleted: false, custom: false,
                        tags: data.tags || Utils.inferTags(data.name, data.focus, data.category),
                        updatedAt: Date.now()
                    };
                    if (idx === -1) this._custom.push(record);
                    else this._custom[idx] = record;
                } else {
                    const idx = this._custom.findIndex(s => s.id === id && !s._baseId);
                    if (idx === -1) throw new Error('未找到该自定义网站');
                    const old = this._custom[idx];
                    this._custom[idx] = {
                        ...old, ...data, id, custom: true,
                        tags: data.tags || Utils.inferTags(data.name, data.focus, data.category),
                        updatedAt: Date.now()
                    };
                }
                this._persist();
                return this.getById(id);
            }

            /** 删除任意网站：基础网站使用墓碑记录隐藏，自定义网站直接删除 */
            remove(id) {
                const current = this.getById(id);
                if (!current) return false;

                if (this.isBase(id)) {
                    const idx = this._custom.findIndex(s => s._baseId === id);
                    if (idx === -1) {
                        this._custom.push({ id, _baseId: id, _deleted: true, custom: false, deletedAt: Date.now() });
                    } else {
                        this._custom[idx] = { ...this._custom[idx], id, _baseId: id, _deleted: true, custom: false, deletedAt: Date.now() };
                    }
                } else {
                    const idx = this._custom.findIndex(s => s.id === id && !s._baseId);
                    if (idx === -1) return false;
                    this._custom.splice(idx, 1);
                }
                this._favorites = this._favorites.filter(fid => fid !== id);
                delete this._updates[id];
                this._recent = this._recent.filter(r => r !== id);
                this._persist();
                return true;
            }

            toggleFavorite(id) {
                const idx = this._favorites.indexOf(id);
                if (idx > -1) this._favorites.splice(idx, 1);
                else this._favorites.push(id);
                this._persist();
                return this._favorites.includes(id);
            }
            isFavorite(id) { return this._favorites.includes(id); }
            getFavorites() { return this._favorites; }
            bulkFavorite(ids) {
                ids.forEach(id => { if (this.getById(id) && !this._favorites.includes(id)) this._favorites.push(id); });
                this._persist();
            }
            bulkUnfavorite(ids) {
                this._favorites = this._favorites.filter(id => !ids.includes(id));
                this._persist();
            }
            getUpdate(id) { return this._updates[id] || null; }
            setUpdate(id, data) {
                this._updates[id] = { ...data, timestamp: Date.now() };
                this._persist();
            }

            /** 批量删除所有选中的可见网站；基础网站通过墓碑记录删除 */
            bulkRemove(ids) {
                const valid = ids.filter(id => this.getById(id));
                let count = 0;
                valid.forEach(id => { if (this.remove(id)) count++; });
                return count;
            }

            addRecent(id) {
                this._recent = this._recent.filter(r => r !== id);
                if (this.getById(id)) this._recent.unshift(id);
                if (this._recent.length > 20) this._recent = this._recent.slice(0, 20);
                this._persist();
            }
            getRecent() { return this._recent; }
            clearRecent() { this._recent = []; this._persist(); }

            importSites(sites, strategy = 'skip') {
                let added = 0, skipped = 0, conflicts = [];
                const existing = this._custom.filter(s => !s._baseId && !s._deleted);
                for (const s of sites) {
                    const dup = existing.some(e => e.name === s.name && e.url === s.url);
                    if (dup) { skipped++; continue; }
                    const nameConflict = existing.some(e => e.name === s.name && e.url !== s.url);
                    if (nameConflict) {
                        if (strategy === 'skip') { skipped++; continue; }
                        if (strategy === 'overwrite') {
                            const idx = this._custom.findIndex(e => !e._baseId && e.name === s.name);
                            if (idx > -1) this._custom.splice(idx, 1);
                        }
                        conflicts.push(s.name);
                    }
                    this._custom.push({
                        ...s, id: Utils.uid(), custom: true,
                        tags: s.tags || Utils.inferTags(s.name, s.focus, s.category),
                        createdAt: Date.now()
                    });
                    added++;
                }
                this._persist();
                return { added, skipped, conflicts };
            }

            /** 导出真正的自定义网站，不导出基础网站的编辑/删除元数据 */
            exportCustom() {
                return this._custom.filter(s => !s._baseId && !s._deleted);
            }

            getStats() {
                const all = this._cache;
                return {
                    total: all.length,
                    s: all.filter(x => x.priority === 'S').length,
                    a: all.filter(x => x.priority === 'A').length,
                    b: all.filter(x => x.priority === 'B').length,
                    custom: all.filter(x => x.custom).length
                };
            }
        }

                this.container = document.getElementById('toastContainer');
            },
            show(msg, type = 'info', duration = 3000) {
                if (!this.container) this.init();
                const el = document.createElement('div');
                el.className = `toast ${type}`;
                el.innerHTML = `<span>${Utils.esc(msg)}</span><button class="toast-close" onclick="this.parentElement.remove()">✕</button>`;
                this.container.appendChild(el);
                setTimeout(() => {
                    if (el.parentElement) el.remove();
                }, duration);
            }
        };
        // 快捷方法
        Utils.toast = (msg, type, duration) => Toast.show(msg, type, duration);

        /** =============================================================
         *  App 主控制器
         *  ============================================================= */
        class App {
            constructor() {
                this.repo = new SiteRepository('energySites', BASE_SITES);
                this.state = {
                    view: 'grid',
                    filters: { search: '', priority: '', country: '', category: '', tag: '', fav: '' },
                    sort: 'priority',
                    selected: new Set(),
                    bulkMode: false,
                    checking: false,
                };
                this._renderTimer = null;
                this._initUI();
                this._bindEvents();
                this._applyTheme();
                this.render();
            }

            /** 初始化UI引用 */
            _initUI() {
                this.els = {
                    search: document.getElementById('search'),
                    priority: document.getElementById('priority'),
                    country: document.getElementById('country'),
                    category: document.getElementById('category'),
                    productTag: document.getElementById('productTag'),
                    favoriteFilter: document.getElementById('favoriteFilter'),
                    content: document.getElementById('content'),
                    stats: document.getElementById('statsContainer'),
                    total: document.getElementById('total'),
                    snum: document.getElementById('snum'),
                    anum: document.getElementById('anum'),
                    bnum: document.getElementById('bnum'),
                    customnum: document.getElementById('customnum'),
                    dlg: document.getElementById('dlg'),
                    dlgTitle: document.getElementById('dlgTitle'),
                    f_name: document.getElementById('f_name'),
                    f_country: document.getElementById('f_country'),
                    f_priority: document.getElementById('f_priority'),
                    f_category: document.getElementById('f_category'),
                    f_url: document.getElementById('f_url'),
                    f_focus: document.getElementById('f_focus'),
                    f_tags: document.getElementById('f_tags'),
                    f_desc: document.getElementById('f_desc'),
                    f_editId: document.getElementById('f_editId'),
                    bulkBar: document.getElementById('bulkBar'),
                    bulkInfo: document.getElementById('bulkInfo'),
                    progressContainer: document.getElementById('progressContainer'),
                    progressFill: document.getElementById('progressFill'),
                    progressLabel: document.getElementById('progressLabel'),
                    progressStatus: document.getElementById('progressStatus'),
                    batchCheckBtn: document.getElementById('batchCheckBtn'),
                    recentContainer: document.getElementById('recentContainer'),
                    recentBar: document.getElementById('recentBar'),
                    noticeBar: document.getElementById('noticeBar'),
                    viewToggle: document.getElementById('viewToggle'),
                    themeToggle: document.getElementById('themeToggle'),
                    importFile: document.getElementById('importFile'),
                };
            }

            /** 绑定事件 */
            _bindEvents() {
                // 搜索输入 (防抖)
                const searchHandler = Utils.debounce(() => { this._updateFilters(); }, 250);
                this.els.search.addEventListener('input', searchHandler);

                // select 使用 change
                ['priority', 'country', 'category', 'productTag', 'favoriteFilter'].forEach(id => {
                    document.getElementById(id).addEventListener('change', () => { this._updateFilters(); });
                });

                // 视图切换
                this.els.viewToggle.addEventListener('click', (e) => {
                    const btn = e.target.closest('button');
                    if (!btn) return;
                    this.els.viewToggle.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    this.state.view = btn.dataset.view;
                    this.render();
                });

                // 主题切换
                this.els.themeToggle.addEventListener('click', () => {
                    const root = document.documentElement;
                    const isDark = root.classList.contains('dark');
                    if (isDark) {
                        root.classList.remove('dark');
                        root.classList.add('light');
                        localStorage.setItem('theme', 'light');
                    } else {
                        root.classList.remove('light');
                        root.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                    }
                });

                // 模态框 - 点击backdrop关闭
                this.els.dlg.addEventListener('click', (e) => {
                    if (e.target === this.els.dlg) this.closeModal();
                });

                // 键盘快捷键
                document.addEventListener('keydown', (e) => {
                    // Ctrl+K 或 / 聚焦搜索
                    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                        e.preventDefault();
                        this.els.search.focus();
                        return;
                    }
                    if (e.key === '/' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                        e.preventDefault();
                        this.els.search.focus();
                        return;
                    }
                    if (e.key === 'Escape') {
                        if (this.els.dlg.open) { this.closeModal(); return; }
                        if (this.els.search.value) { this.els.search.value = '';
                            this._updateFilters(); return; }
                        if (this.state.selected.size) { this.clearBulk(); return; }
                    }
                    if (e.key === 'n' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
                        e.preventDefault();
                        this.openAdd();
                    }
                });

                // 批量复选框代理 (事件委托)
                this.els.content.addEventListener('change', (e) => {
                    const cb = e.target.closest('.card-checkbox input[type="checkbox"]');
                    if (!cb) return;
                    const id = cb.dataset.id;
                    if (cb.checked) this.state.selected.add(id);
                    else this.state.selected.delete(id);
                    this._updateBulkBar();
                });

                // 全选逻辑: 在卡片渲染时通过 data 控制
            }

            /** 更新筛选器状态 */
            _updateFilters() {
                this.state.filters = {
                    search: this.els.search.value.trim(),
                    priority: this.els.priority.value,
                    country: this.els.country.value,
                    category: this.els.category.value,
                    tag: this.els.productTag.value,
                    fav: this.els.favoriteFilter.value,
                };
                this.render();
            }

            /** 获取筛选后的站点列表 + 排序 */
            _getFilteredSites() {
                const f = this.state.filters;
                let list = this.repo.getAll();

                // 高级搜索解析
                const q = f.search;
                let textQuery = q;
                const parsed = { country: '', tag: '', priority: '', category: '' };
                // 提取语义: country:菲律宾 tag:户储 priority:S category:政策
                const matches = q.match(/(country|tag|priority|category):(\S+)/g);
                if (matches) {
                    matches.forEach(m => {
                        const [key, val] = m.split(':');
                        parsed[key] = val;
                        textQuery = textQuery.replace(m, '').trim();
                    });
                }

                // 基础筛选
                list = list.filter(s => {
                    // 普通文本搜索
                    let matchText = true;
                    if (textQuery) {
                        const haystack = [s.name, s.country, s.category, s.focus, s.desc, (s.tags || []).join(' ')]
                            .join(' ')
                            .toLowerCase();
                        matchText = haystack.includes(textQuery.toLowerCase());
                    }
                    if (!matchText) return false;

                    // 语义筛选
                    if (parsed.country && !s.country.toLowerCase().includes(parsed.country.toLowerCase())) return false;
                    if (parsed.tag && !(s.tags || []).some(t => t.toLowerCase() === parsed.tag.toLowerCase()))
                    return false;
                    if (parsed.priority && s.priority !== parsed.priority) return false;
                    if (parsed.category && !s.category.toLowerCase().includes(parsed.category.toLowerCase()))
                    return false;

                    // UI筛选
                    if (f.priority && s.priority !== f.priority) return false;
                    if (f.country && s.country !== f.country) return false;
                    if (f.category && s.category !== f.category) return false;
                    if (f.tag && !(s.tags || []).includes(f.tag)) return false;
                    if (f.fav === 'fav' && !this.repo.isFavorite(s.id)) return false;
                    return true;
                });

                // 排序
                const sort = this.state.sort || 'priority';
                const orderMap = { 'S': 0, 'A': 1, 'B': 2 };
                if (sort === 'priority') {
                    list.sort((a, b) => (orderMap[a.priority] || 3) - (orderMap[b.priority] || 3));
                } else if (sort === 'name-asc') {
                    list.sort((a, b) => a.name.localeCompare(b.name));
                } else if (sort === 'name-desc') {
                    list.sort((a, b) => b.name.localeCompare(a.name));
                } else if (sort === 'country') {
                    list.sort((a, b) => a.country.localeCompare(b.country));
                } else if (sort === 'created') {
                    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                }
                return list;
            }

            /** 渲染主界面 */
            render() {
                // 清除选中状态 (保留批量)
                if (!this.state.bulkMode) this.state.selected.clear();

                const list = this._getFilteredSites();
                const stats = this.repo.getStats();

                // 更新统计
                this.els.total.textContent = stats.total;
                this.els.snum.textContent = stats.s;
                this.els.anum.textContent = stats.a;
                this.els.bnum.textContent = stats.b;
                this.els.customnum.textContent = stats.custom;

                // 更新筛选器选项 (国家/分类)
                this._populateFilters();

                // 按分类分组
                const groups = {};
                list.forEach(s => {
                    if (!groups[s.category]) groups[s.category] = [];
                    groups[s.category].push(s);
                });

                const viewClass = this.state.view === 'list' ? 'list-view' : '';
                let html = '';
                const sortOptions = `
                    <select id="sortSelect" onchange="app.state.sort=this.value;app.render();">
                        <option value="priority" ${this.state.sort==='priority'?'selected':''}>按优先级</option>
                        <option value="name-asc" ${this.state.sort==='name-asc'?'selected':''}>名称 A→Z</option>
                        <option value="name-desc" ${this.state.sort==='name-desc'?'selected':''}>名称 Z→A</option>
                        <option value="country" ${this.state.sort==='country'?'selected':''}>国家 A→Z</option>
                        <option value="created" ${this.state.sort==='created'?'selected':''}>添加时间 (新→旧)</option>
                    </select>
                `;

                if (Object.keys(groups).length === 0) {
                    html = this._renderEmpty();
                } else {
                    html = Object.keys(groups).map(cat => {
                        const items = groups[cat];
                        return `
                            <section class="category">
                                <div class="cat-head">
                                    <h2>${Utils.esc(cat)}</h2>
                                    <div class="cat-meta">
                                        <span>${items.length} 个</span>
                                        ${sortOptions}
                                    </div>
                                </div>
                                <div class="grid ${viewClass}">
                                    ${items.map(s => this._renderCard(s)).join('')}
                                </div>
                            </section>
                        `;
                    }).join('');
                }

                this.els.content.innerHTML = html;

                // 更新批量栏
                this._updateBulkBar();

                // 更新最近访问
                this._renderRecent();

                // 恢复选中状态
                if (this.state.selected.size) {
                    document.querySelectorAll('.card-checkbox input[type="checkbox"]').forEach(cb => {
                        if (this.state.selected.has(cb.dataset.id)) cb.checked = true;
                    });
                }
            }

            /** 渲染单个卡片 */
            _renderCard(s) {
                const fav = this.repo.isFavorite(s.id);
                const update = this.repo.getUpdate(s.id);
                const iconUrl = `https://www.google.com/s2/favicons?domain=${Utils.getDomain(s.url)}&sz=32`;
                const checked = this.state.selected.has(s.id) ? 'checked' : '';
                const tagsHtml = (s.tags || []).map(t => {
                    const cls = TAG_COLOR_MAP[t] || '';
                    return `<span class="tag ${cls}">${Utils.esc(t)}</span>`;
                }).join('');

                const updatedHtml = update ?
                    `最近检查：${Utils.esc(update.status || '')}${update.date ? ' · '+Utils.esc(update.date) : ''}` :
                    '未检查';

                const customActions = `
                        <button onclick="app.editSite('${s.id}')">✎ 编辑</button>
                        <button class="danger" onclick="app.deleteSite('${s.id}')">🗑 删除</button>
                    `;

                // 打开链接时记录最近访问
                const openUrl = `javascript:app.recordVisit('${s.id}');window.open('${Utils.esc(s.url)}','_blank');`;

                return `
                    <div class="card" data-id="${s.id}">
                        <div class="card-top">
                            <div class="card-checkbox">
                                <input type="checkbox" data-id="${s.id}" ${checked}>
                            </div>
                            <div class="site-icon">
                                <img src="${Utils.esc(iconUrl)}" alt="" loading="lazy" onerror="this.style.display='none'">
                            </div>
                            <div class="card-name">${Utils.esc(s.name)}</div>
                            <span class="badge ${s.priority}">${s.priority}级</span>
                            <button class="fav-btn ${fav?'on':''}" onclick="app.toggleFav('${s.id}')" title="收藏">${fav?'★':'☆'}</button>
                        </div>
                        <div class="card-meta">
                            <span>${Utils.esc(s.country)}</span>
                            <span>·</span>
                            <span>${Utils.esc(s.category)}</span>
                            ${s.custom ? '<span>· 自定义</span>' : ''}
                            ${s.createdAt ? '<span>· '+Utils.formatTime(s.createdAt)+'</span>' : ''}
                        </div>
                        <div class="card-desc">${Utils.esc(s.desc)}</div>
                        <div class="card-tags">${tagsHtml}</div>
                        <div class="card-updated">${updatedHtml}</div>
                        <div class="card-actions">
                            <a href="javascript:void(0)" onclick="${openUrl}">打开网站 ↗</a>
                            <button onclick="app.checkUpdate('${s.id}')">检查更新</button>
                            ${customActions}
                        </div>
                    </div>
                `;
            }

            /** 空状态 */
            _renderEmpty() {
                return `
                    <div class="empty">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-title">没有匹配的网站</div>
